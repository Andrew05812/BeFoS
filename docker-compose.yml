services:
  postgres:
    image: postgres:16-alpine
    container_name: befos_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-befos}
      # The default below is a development convenience, and `ENVIRONMENT=production` refuses
      # to start while the DSN still carries it (app/core/config.py). Override it for
      # anything that is not a laptop.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-befos_password}
      POSTGRES_DB: ${POSTGRES_DB:-befos}
    ports:
      # Loopback only: the tests and `psql` on the host reach it as localhost:5432, while a
      # server started from this file no longer answers on the network interface, where the
      # shipped default password would be reachable by anybody who can route to the host.
      - "127.0.0.1:5432:5432"
    volumes:
      - befos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-befos} -d ${POSTGRES_DB:-befos}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: befos_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Always target the postgres service inside the compose network.
      # The root .env DATABASE_URL points at localhost:5433 for bare-metal runs
      # and must NOT leak into the container, so it is derived here explicitly.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-befos}:${POSTGRES_PASSWORD:-befos_password}@postgres:5432/${POSTGRES_DB:-befos}
      JWT_SECRET: ${JWT_SECRET:-change-me-access-secret-key-min-32-chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh-secret-key-min-32-chars}
      # The key that seals a "continue from here" link. Deliberately a different secret from the two
      # above (see .env.example), and deliberately read from the same .env rather than generated at
      # start: a key that changes on every deploy refuses every walk in progress at once. Rotating it
      # is a two-step procedure with the retired key left in the ring — docs/OPERATIONS.md.
      CURSOR_SECRET: ${CURSOR_SECRET:-change-me-cursor-secret-min-32-chars}
      CURSOR_KEY_ID: ${CURSOR_KEY_ID:-a}
      CURSOR_SECRET_PREVIOUS: ${CURSOR_SECRET_PREVIOUS:-}
      CURSOR_KEY_ID_PREVIOUS: ${CURSOR_KEY_ID_PREVIOUS:-}
      CURSOR_LINK_MINUTES: ${CURSOR_LINK_MINUTES:-720}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000,http://10.0.2.2:8000}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEMO_ENABLED: ${DEMO_ENABLED:-true}
      DEMO_EMAIL: ${DEMO_EMAIL:-demo@befos.app}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-Demo12345}
      # The letter channel. `outbox` is the development default and writes into the container's own
      # filesystem, which is not a volume: a rebuild erases the letters with it, and that is the
      # honest shape of a stand that does not deliver mail. A real peer — host, credentials, sender
      # — is the owner's decision and arrives from the deployment's environment, never from this
      # file (see .env.example, «Подключать почтовый сервис решает владелец»).
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-outbox}
      MAIL_OUTBOX_DIR: ${MAIL_OUTBOX_DIR:-/app/outbox}
      MAIL_FROM: ${MAIL_FROM:-no-reply@befos.local}
      MAIL_LINK_BASE: ${MAIL_LINK_BASE:-}
      # The personal invitation is a client deep link, not a web page: until a page exists the
      # prefix stays the custom scheme the Android manifest declares (docs/OPERATIONS.md §11).
      INVITE_LINK_BASE: ${INVITE_LINK_BASE:-befos://invite}
      MAIL_SMTP_HOST: ${MAIL_SMTP_HOST:-}
      MAIL_SMTP_PORT: ${MAIL_SMTP_PORT:-587}
      MAIL_SMTP_USERNAME: ${MAIL_SMTP_USERNAME:-}
      MAIL_SMTP_PASSWORD: ${MAIL_SMTP_PASSWORD:-}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-true}
      RESET_CODE_MINUTES: ${RESET_CODE_MINUTES:-30}
      # The window of the address-confirmation letter. Longer than the reset one: it waits for a
      # person who registered and went back to their work, not for one sitting at the screen.
      CONFIRM_CODE_MINUTES: ${CONFIRM_CODE_MINUTES:-60}
      UPLOAD_DIR: /app/uploads
      # Whose window the limiter counts: the address of the connection, or the address a proxy
      # wrote down. --no-proxy-headers below removes uvicorn's address rewrite, so this switch
      # becomes the only place where that trust is declared. Set it to true only when a proxy in
      # front of this container really overwrites X-Forwarded-For: with a false claim of trust,
      # the caller picks its own window.
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
    ports:
      - "8000:8000"
    healthcheck:
      # The process answering is a different claim from the database answering; the
      # database half is /api/v1/health/db and OPERATIONS.md says which one to alert on.
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "3", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Migrations and seeding run in the same command before uvicorn starts.
      start_period: 60s
    volumes:
      - befos_uploads:/app/uploads
      # The development mailbox. A named volume rather than the container's own filesystem, so
      # the letters survive a rebuild and the live journey can read one out of it
      # (`docker compose cp backend:/app/outbox .`) the way a person reads it out of a mail client.
      # It is still not delivery: production refuses `outbox` at startup (core/config.py).
      - befos_outbox:/app/outbox
    # uvicorn closes an idle keep-alive socket after five seconds unless told otherwise, and
    # five seconds is shorter than a pause between two actions in the app. Measured on the
    # emulator over one socket: a second request answered after 1 s and after 4 s of idle and
    # got nothing after 8 s, 20 s and 40 s; watched from the host, the peer's FIN landed
    # 5000 ms after the first response. Rebuilding the connection is not free either — a fresh
    # socket answered its first response line 560-583 ms after the client started across the
    # probe's repeats, while the second request of one live socket, written 2 s in, was
    # answered ~110 ms later. The client's pool keeps an idle connection for minutes (OkHttp
    # ships that default, it is not measured here), so 75 s is the compromise: it outlives a
    # reader dwelling on a card without holding a socket per abandoned client for minutes. If
    # a proxy with a shorter idle timeout is ever put in front of this, the value has to
    # become smaller than that proxy's own.
    # --no-proxy-headers removes the second default this stand inherited. uvicorn replaces the
    # peer address of a connection with X-Forwarded-For whenever that peer is listed in
    # forwarded_allow_ips, and both halves of that rule are defaults nobody wrote down here
    # (proxy_headers=True, forwarded_allow_ips="127.0.0.1"). Measured against this container with
    # GET /users/me, RATE_LIMIT_PER_MINUTE at its 120 default, the container restarted between
    # sweeps because the window lives in process memory: 130 requests with no forwarded header
    # answered 120 and refused from #121; 300 requests rotating 30 identities through the
    # published port behaved the same way (120 answered, 180 refused), because the peer there is
    # the Docker bridge, not a trusted proxy; the same rotation issued from the container's own
    # loopback answered all 300 and refused none — the bucket had moved into a header the caller
    # writes. That last path is any process of the same host, a neighbour sharing the network
    # namespace, an SSRF against 127.0.0.1, and the bare-metal run README documents. With the
    # flag, the connection's address stays the limiter's key and the only way to trust the
    # header is TRUST_PROXY_HEADERS above.
    command: >
      sh -c "alembic upgrade head &&
             python -m app.seed --if-empty &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --timeout-keep-alive 75 --no-proxy-headers"

volumes:
  befos_pgdata:
  befos_uploads:
  befos_outbox:
