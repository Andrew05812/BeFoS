# Every number this repository quotes about itself is produced by these five jobs.
#
# They are the same commands a developer runs locally, against the same Postgres major version
# the container ships, so "green" here means the same thing it means on a laptop: the backend
# answers, the migrations match the models, the app builds and its unit tests pass, nothing in
# either resolved dependency graph has a published flaw, and a real two-user journey over HTTP
# and WebSocket completes against the built image.
#
# None of it touches secrets: the stack runs with the development defaults from
# docker-compose.yml, and the live journey deletes the accounts it creates.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend test suite
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: befos
          POSTGRES_PASSWORD: befos_password
          POSTGRES_DB: befos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U befos -d befos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # asyncpg resolving "localhost" to ::1 while the published port listens on IPv4 has
      # bitten this project before; the address is written out.
      BEFOS_TEST_PG_HOST: 127.0.0.1
      BEFOS_TEST_PG_PORT: "5432"
      BEFOS_TEST_PG_USER: befos
      BEFOS_TEST_PG_PASSWORD: befos_password
      BEFOS_TEST_DB: befos_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install runtime and test dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Run the suite
        working-directory: backend
        run: python -m pytest -q

  migrations:
    name: schema matches the models
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: befos
          POSTGRES_PASSWORD: befos_password
          POSTGRES_DB: befos_schema
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U befos -d befos_schema"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://befos:befos_password@127.0.0.1:5432/befos_schema
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install runtime dependencies
        run: python -m pip install -r backend/requirements.txt

      # An empty database is brought up by the revision chain alone, then compared with the
      # models: a model change without a migration, or a migration that no longer matches the
      # models, fails here rather than on the first deploy.
      - name: Upgrade from empty
        working-directory: backend
        run: alembic upgrade head

      - name: No drift between revisions and models
        working-directory: backend
        run: alembic check

      # Downgrade to the base revision and back up, so the escape hatch documented in
      # docs/OPERATIONS.md is known to work instead of assumed.
      - name: Downgrade is reversible
        working-directory: backend
        run: |
          alembic downgrade base
          alembic upgrade head

  android:
    name: mobile tests and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Unit tests
        working-directory: android
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Debug build
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug

      # The resolved runtime classpath, for the advisory job below. A manifest says what was
      # asked for; this says what got downloaded. Written under build/ so a local run of the
      # same command cannot leave an untracked artefact in the tree.
      - name: Dump the resolved dependency graph
        working-directory: android
        run: ./gradlew --no-daemon :app:dependencies --configuration debugRuntimeClasspath > app/build/gradle-deps.txt

      - name: Publish the resolved graph
        uses: actions/upload-artifact@v7
        with:
          name: gradle-dependency-tree
          path: android/app/build/gradle-deps.txt
          if-no-files-found: error

      - name: Publish the test report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-reports
          path: android/app/build/reports/tests/**

  advisories:
    name: no published flaw in either resolved graph
    runs-on: ubuntu-latest
    needs: [android]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install runtime dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Fetch the resolved Android graph
        uses: actions/download-artifact@v4
        with:
          name: gradle-dependency-tree
          path: resolved

      # The same database Dependabot reads, asked about the transitive set instead of the
      # manifests. Exits non-zero on anything affected, on a range it could not read, or on a
      # query that failed — a silent "nothing found" is not an option here.
      # GITHUB_TOKEN only raises the API rate limit; it is not written to any file.
      - name: Backend graph
        working-directory: backend
        run: |
          pip freeze | python ops/check_advisories.py --pip-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Mobile graph
        working-directory: backend
        run: |
          python ops/check_advisories.py --gradle-tree ../resolved/gradle-deps.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  journey:
    name: live journey against the built image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Build the container image
        run: docker compose build backend

      # The image must import its own application: a missing runtime dependency or a module
      # that only works with the test tooling installed fails here, before a container is up.
      # The name comes from compose itself rather than from a guessed project prefix.
      - name: The image imports the application
        run: |
          image=$(docker compose config --images | grep backend)
          echo "checking ${image}"
          docker run --rm --entrypoint sh "${image}" -c \
            'python -c "import app.main" && id && ! command -v gcc'

      - name: Start the stack
        run: docker compose up -d

      - name: Wait for the database-backed readiness
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/api/v1/health/db >/dev/null; then
              echo "ready after ${attempt} attempts"
              exit 0
            fi
            sleep 3
          done
          docker compose logs --no-color backend
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install the journey client
        run: python -m pip install -r backend/requirements-dev.txt

      # Register → onboarding → test → compatibility → discovery → like → match → realtime chat
      # → recommendation, over HTTP and WebSocket, asserting on live data the whole way.
      - name: Run the journey
        working-directory: backend
        run: python e2e_journey.py

      - name: Show the server log on failure
        if: failure()
        run: docker compose logs --no-color backend

      - name: Tear the stack down
        if: always()
        run: docker compose down -v
